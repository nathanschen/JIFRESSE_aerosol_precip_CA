name: milestone_01_persistence_hybrid
backend: optuna
pipeline: persistence_hybrid
storage: sqlite:///outputs/studies/milestone_01_persistence_hybrid.db
trials: 6
seed: 42
search_space:
  classifier__max_depth:
    type: int
    low: 4
    high: 10
  classifier__learning_rate:
    type: float
    low: 0.01
    high: 0.2
    log: true
  classifier__n_estimators:
    type: int
    low: 100
    high: 400
  classifier__subsample:
    type: float
    low: 0.6
    high: 1.0
  classifier__colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
  classifier__min_child_weight:
    type: float
    low: 1.0
    high: 8.0
  classifier__gamma:
    type: float
    low: 0.0
    high: 2.0
  classifier__scale_pos_weight:
    type: float
    low: 1.0
    high: 50.0
    log: true
  occurrence_probability_threshold:
    type: float
    low: 0.1
    high: 0.9
