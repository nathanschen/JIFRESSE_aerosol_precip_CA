name: milestone_01_temporal_unet
backend: optuna
storage: sqlite:///outputs/studies/milestone_01_temporal_unet.db
trials: 20
seed: 42
early_stopping_patience: 2
max_hours_per_family: 2
search_space:
  learning_rate:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  batch_size:
    type: categorical
    choices: [2, 4, 8]
  hidden_channels:
    type: categorical
    choices: [16, 32, 48]
  sequence_length:
    type: categorical
    choices: [2, 3, 4]
